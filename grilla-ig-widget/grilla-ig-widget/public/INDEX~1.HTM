<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grilla IG</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #dbdbdb;
    --text: #262626;
    --muted: #8e8e8e;
    --accent: #7B5EA7;
  }
  html[data-theme="dark"] {
    --bg: #000000;
    --card: #121212;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --muted: #a8a8a8;
    --accent: #b298e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .2s ease, color .2s ease;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 30px; }

  /* setup panel (shown when no ?db= present, or via gear icon) */
  .setup {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 16px;
    padding: 16px;
    font-size: 13px;
  }
  .setup h2 { font-size: 15px; margin: 0 0 8px; }
  .setup p { color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
  .setup input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .setup button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* profile header */
  .profile {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 16px 10px;
  }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(45deg, #C45580, #7B5EA7);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 18px;
    flex-shrink: 0; background-size: cover; background-position: center;
  }
  .profile .meta { flex: 1; min-width: 0; }
  .profile .handle { font-weight: 700; font-size: 15px; }
  .profile .stats { display: flex; gap: 16px; margin-top: 6px; font-size: 12px; color: var(--text); }
  .profile .stats b { display: block; font-size: 14px; }
  .profile .stats span { color: var(--muted); }

  .toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 16px 14px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar .spacer { flex: 1; }
  .iconbtn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 9px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .iconbtn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .grid {
    display: grid;
    gap: 3px;
    padding: 3px;
  }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .grid.cols-5 { grid-template-columns: repeat(5, 1fr); }

  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    background-size: cover;
    background-position: center;
    background-color: var(--border);
    overflow: hidden;
  }
  .tile .badge { position: absolute; top: 6px; right: 6px; font-size: 15px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .tile .pin { position: absolute; top: 6px; left: 6px; font-size: 13px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .tile .dot { position: absolute; bottom: 6px; left: 6px; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
  .tile .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.85) 100%);
    opacity: 0; transition: opacity .15s ease;
    display: flex; align-items: flex-end; padding: 8px;
  }
  .tile:hover .overlay, .tile:active .overlay { opacity: 1; }
  .tile .overlay .info { color: #fff; font-size: 11px; line-height: 1.35; }
  .tile .overlay .info .name { font-weight: 700; display: block; margin-bottom: 2px; }
  .tile .overlay .info .date { opacity: .85; }
  .tile.no-image { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 10px; text-align: center; padding: 6px; background: var(--card); }
  .tile.pillar-tint::before { content: ''; position: absolute; inset: 0; background: var(--pillar-color, transparent); opacity: .5; mix-blend-mode: multiply; }

  .legend { display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 16px; font-size: 11px; color: var(--text); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .status { padding: 6px 16px; font-size: 11px; color: var(--muted); }
  .status.error { color: #c0392b; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }

  .tile { cursor: pointer; }

  /* post preview modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: var(--card);
    color: var(--text);
    width: 100%; max-width: 420px;
    border-radius: 12px;
    overflow: hidden;
    max-height: 92vh;
    display: flex; flex-direction: column;
    position: relative;
  }
  .modal-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head .mini-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(45deg, #C45580, #7B5EA7);
    background-size: cover; background-position: center;
    flex-shrink: 0;
  }
  .modal-head .mini-handle { font-weight: 700; font-size: 13px; flex: 1; }
  .modal-close { border: none; background: transparent; font-size: 18px; cursor: pointer; color: var(--text); padding: 4px 8px; }
  .modal-img-wrap { position: relative; background: #000; }
  .modal-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
  .modal-img-wrap.no-image { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; background: var(--bg); }
  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,.9); border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; color: #262626;
  }
  .nav-arrow.prev { left: 8px; }
  .nav-arrow.next { right: 8px; }
  .modal-actions { display: flex; align-items: center; gap: 12px; padding: 10px 12px 4px; font-size: 18px; }
  .modal-actions .spacer { flex: 1; }
  .modal-meta { padding: 4px 12px 6px; font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .modal-meta .estado-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .modal-caption { padding: 4px 12px 14px; font-size: 13px; line-height: 1.45; overflow-y: auto; }
  .modal-caption b { margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="setupPanel" class="setup" style="display:none;">
    <h2>🖼️ Grilla IG</h2>
    <p>Pegá el ID o el link de la base de datos de Notion de este cliente. La base debe estar compartida con tu integración de Notion.</p>
    <input type="text" id="dbInput" placeholder="ID de la base de datos de Notion">
    <button id="loadBtn">Cargar grilla</button>
    <p style="margin-top:10px;">Tip: para insertarla en Notion, agregá <code>?db=ESE_ID</code> al final de la URL de esta página y pegala como bloque <code>/embed</code>.</p>
  </div>

  <div class="profile">
    <div class="avatar" id="avatar">IG</div>
    <div class="meta">
      <div class="handle" id="handle">grilla</div>
      <div class="bio" id="bioText" style="display:none; font-size:12px; color:var(--muted); margin-top:4px;"></div>
      <div class="stats">
        <div><b id="statCount">0</b><span>posts</span></div>
      </div>
    </div>
    <button class="iconbtn" id="gearBtn" title="Configurar base de datos">⚙️</button>
  </div>

  <div id="highlightsRow" style="display:none; gap:14px; padding:4px 16px 12px; overflow-x:auto;"></div>

  <div class="toolbar">
    <button class="iconbtn" id="refreshBtn">↻ Actualizar</button>
    <div id="colToggles"></div>
    <div id="sortToggles"></div>
    <div id="mapToggle"></div>
    <div id="bioToggle"></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn">🌙</button>
  </div>

  <div class="legend" id="legend"></div>
  <div class="status" id="status"></div>

  <div id="gridWrap">
    <div class="empty">Cargando…</div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card">
    <div class="modal-head">
      <div class="mini-avatar" id="modalAvatar"></div>
      <div class="mini-handle" id="modalHandle"></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-img-wrap" id="modalImgWrap">
      <img class="modal-img" id="modalImg" alt="">
      <button class="nav-arrow prev" id="modalPrev">‹</button>
      <button class="nav-arrow next" id="modalNext">›</button>
    </div>
    <div class="modal-actions">
      <span>♡</span><span>💬</span><span>➤</span><div class="spacer"></div><span>🔖</span>
    </div>
    <div class="modal-meta">
      <span id="modalFormato"></span>
      <span id="modalEstadoWrap"><span class="estado-dot" id="modalEstadoDot"></span> <span id="modalEstado"></span></span>
      <span id="modalFecha"></span>
      <span id="modalPilar"></span>
    </div>
    <div class="modal-caption"><b id="modalCaptionHandle"></b><span id="modalCopy"></span></div>
  </div>
</div>

<script>
const PREFS_KEY = 'ig-widget-prefs-v1';
const params = new URLSearchParams(location.search);

let state = {
  db: params.get('db') || '',
  cols: 3,
  sort: 'chrono',
  view: 'normal',
  theme: 'light',
  showBio: true,
  rows: [],
  sorted: [],
  modalIndex: -1
};

const PILAR_COLORS = {
  'Educativo': '#4C7BD9', 'Inspiracional': '#E0972F', 'Detras de escena': '#D9B531',
  'Producto/Servicio': '#C4506B', 'Testimonios': '#8A8A8A'
};
const PILAR_FALLBACK = ['#7B5EA7','#C45580','#4C7BD9','#3FA37A','#D9B531','#E0972F','#8A8A8A'];
const ESTADO_COLORS = { 'Sin empezar': '#B7AFCB', 'Idea': '#B7AFCB', 'Material pendiente': '#D9B531', 'En curso': '#4C7BD9', 'En progreso': '#4C7BD9', 'Listo': '#3FA37A' };

function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch(e) { return {}; } }
function savePrefs() { localStorage.setItem(PREFS_KEY, JSON.stringify({ cols: state.cols, sort: state.sort, view: state.view, theme: state.theme, showBio: state.showBio })); }

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = 'status' + (isError ? ' error' : '');
}

function pilarColor(name, idx) { return PILAR_COLORS[name] || PILAR_FALLBACK[idx % PILAR_FALLBACK.length]; }
function formatBadge(formato) {
  const f = (formato || '').toLowerCase();
  if (f.includes('carr')) return '📑';
  if (f.includes('reel')) return '🎬';
  return '';
}

function sortRows(rows) {
  const copy = [...rows];
  if (state.sort === 'chrono') {
    copy.sort((a, b) => (a.fecha || '9999').localeCompare(b.fecha || '9999'));
  } else {
    copy.sort((a, b) => { if (a.fijado !== b.fijado) return a.fijado ? -1 : 1; return (b.fecha || '').localeCompare(a.fecha || ''); });
  }
  return copy;
}

function renderLegend(rows) {
  const el = document.getElementById('legend');
  if (state.view !== 'map') { el.innerHTML = ''; return; }
  const pilares = [...new Set(rows.map(r => r.pilar).filter(Boolean))];
  el.innerHTML = pilares.map((p, i) => '<span><span class="swatch" style="background:' + pilarColor(p, i) + '"></span>' + p + '</span>').join('');
}

function renderGrid() {
  const wrap = document.getElementById('gridWrap');
  const rows = sortRows(state.rows);
  state.sorted = rows;
  renderLegend(rows);
  document.getElementById('statCount').textContent = rows.length;
  if (!rows.length) { wrap.innerHTML = '<div class="empty">No hay posts en esta base todavía.</div>'; return; }
  const pilarIndex = {};
  [...new Set(rows.map(r => r.pilar).filter(Boolean))].forEach((p, i) => pilarIndex[p] = i);

  const tiles = rows.map((r, idx) => {
    const badge = formatBadge(r.formato);
    const hasImg = !!r.imagen;
    const tint = state.view === 'map' && r.pilar ? ('--pillar-color:' + pilarColor(r.pilar, pilarIndex[r.pilar]) + ';') : '';
    const cls = 'tile' + (state.view === 'map' && r.pilar ? ' pillar-tint' : '') + (!hasImg ? ' no-image' : '');
    const bg = hasImg ? ("background-image:url('" + r.imagen.replace(/'/g, '%27') + "');") : '';
    const dot = ESTADO_COLORS[r.estado] || '#B7AFCB';
    const fecha = r.fecha ? new Date(r.fecha + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }) : '';
    return (
      '<div class="' + cls + '" data-idx="' + idx + '" style="' + bg + tint + '" title="' + (r.nombre||'').replace(/"/g,'') + '">' +
      (!hasImg ? ('<span>' + r.nombre + '</span>') : '') +
      (badge ? '<span class="badge">' + badge + '</span>' : '') +
      (r.fijado ? '<span class="pin">📌</span>' : '') +
      '<span class="dot" style="background:' + dot + '"></span>' +
      '<div class="overlay"><div class="info"><span class="name">' + r.nombre + '</span>' +
      (fecha ? ('<span class="date">' + fecha + (r.pilar ? ' · ' + r.pilar : '') + '</span>') : '') +
      '</div></div></div>'
    );
  }).join('');

  wrap.innerHTML = '<div class="grid cols-' + state.cols + '">' + tiles + '</div>';
  wrap.querySelectorAll('.tile').forEach(el => {
    el.addEventListener('click', () => openModal(parseInt(el.getAttribute('data-idx'), 10)));
  });
}

function openModal(idx) {
  if (idx < 0 || idx >= state.sorted.length) return;
  state.modalIndex = idx;
  const r = state.sorted[idx];
  const handle = document.getElementById('handle').textContent;

  document.getElementById('modalHandle').textContent = handle;
  document.getElementById('modalCaptionHandle').textContent = handle;
  const avatarUrl = params.get('avatar');
  const modalAvatar = document.getElementById('modalAvatar');
  modalAvatar.style.backgroundImage = avatarUrl ? "url('" + avatarUrl + "')" : '';

  const imgWrap = document.getElementById('modalImgWrap');
  const img = document.getElementById('modalImg');
  if (r.imagen) {
    imgWrap.classList.remove('no-image');
    img.style.display = 'block';
    img.src = r.imagen;
  } else {
    imgWrap.classList.add('no-image');
    img.style.display = 'none';
  }

  document.getElementById('modalFormato').textContent = r.formato ? (formatBadge(r.formato) + ' ' + r.formato) : '';
  document.getElementById('modalEstado').textContent = r.estado || '';
  document.getElementById('modalEstadoDot').style.background = ESTADO_COLORS[r.estado] || '#B7AFCB';
  document.getElementById('modalFecha').textContent = r.fecha ? new Date(r.fecha + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' }) : '';
  document.getElementById('modalPilar').textContent = r.pilar ? ('· ' + r.pilar) : '';
  document.getElementById('modalCopy').textContent = r.copy ? (' ' + r.copy) : ' (sin copy todavía)';

  document.getElementById('modalPrev').style.visibility = idx > 0 ? 'visible' : 'hidden';
  document.getElementById('modalNext').style.visibility = idx < state.sorted.length - 1 ? 'visible' : 'hidden';

  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); state.modalIndex = -1; }
function navModal(delta) {
  const next = state.modalIndex + delta;
  if (next >= 0 && next < state.sorted.length) openModal(next);
}

async function loadGrid() {
  if (!state.db) {
    document.getElementById('setupPanel').style.display = 'block';
    document.getElementById('gridWrap').innerHTML = '';
    setStatus('');
    return;
  }
  document.getElementById('setupPanel').style.display = 'none';
  setStatus('Cargando desde Notion…');
  try {
    const r = await fetch('/api/grid?db=' + encodeURIComponent(state.db), { cache: 'no-store' });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error desconocido');
    state.rows = data.posts || [];
    renderGrid();
    setStatus(state.rows.length + ' posts · actualizado ' + new Date().toLocaleTimeString('es-AR'));
  } catch (e) {
    setStatus('Error: ' + e.message, true);
    document.getElementById('gridWrap').innerHTML = '<div class="empty">No se pudo cargar la grilla.</div>';
  }
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeBtn').textContent = state.theme === 'dark' ? '☀️' : '🌙';
}

function buildToggle(container, options, key) {
  container.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'iconbtn' + (state[key] === opt.value ? ' active' : '');
    btn.textContent = opt.label;
    btn.onclick = () => {
      state[key] = opt.value;
      [...container.children].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
      savePrefs();
    };
    container.appendChild(btn);
  });
}

function applyBioHighlights() {
  const bioEl = document.getElementById('bioText');
  const hlRow = document.getElementById('highlightsRow');
  if (state.showBio) {
    const bio = params.get('bio') || 'Planeado con The Content Edit ✨ (personalizá con ?bio=)';
    bioEl.textContent = bio;
    bioEl.style.display = 'block';

    const hlParam = params.get('highlights');
    const highlights = hlParam ? hlParam.split(',').map(s => s.trim()).filter(Boolean) : ['Novedades', 'Colabs', 'Tendencias'];
    hlRow.innerHTML = highlights.map(h => (
      '<div style="display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0;">' +
      '<div style="width:48px; height:48px; border-radius:50%; background:linear-gradient(45deg,#C45580,#7B5EA7); opacity:.55;"></div>' +
      '<span style="font-size:10px; color:var(--muted); max-width:56px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + h + '</span>' +
      '</div>'
    )).join('');
    hlRow.style.display = 'flex';
  } else {
    bioEl.style.display = 'none';
    hlRow.style.display = 'none';
  }
}

function init() {
  const prefs = loadPrefs();
  state.cols = prefs.cols || 3;
  state.sort = prefs.sort || 'chrono';
  state.view = prefs.view || 'normal';
  state.theme = prefs.theme || 'light';
  state.showBio = prefs.showBio !== undefined ? prefs.showBio : true;
  applyTheme();
  applyBioHighlights();

  document.getElementById('handle').textContent = params.get('name') || 'tu_cliente';
  const avatarUrl = params.get('avatar');
  const avatarEl = document.getElementById('avatar');
  if (avatarUrl) { avatarEl.style.backgroundImage = "url('" + avatarUrl + "')"; avatarEl.textContent = ''; }
  else { avatarEl.textContent = (params.get('name') || 'IG').slice(0,2).toUpperCase(); }

  document.getElementById('dbInput').value = state.db;
  document.getElementById('loadBtn').addEventListener('click', () => {
    state.db = document.getElementById('dbInput').value.trim();
    const url = new URL(location.href);
    url.searchParams.set('db', state.db);
    history.replaceState(null, '', url);
    loadGrid();
  });
  document.getElementById('gearBtn').addEventListener('click', () => {
    const panel = document.getElementById('setupPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  });
  document.getElementById('refreshBtn').addEventListener('click', loadGrid);
  document.getElementById('themeBtn').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme(); savePrefs();
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalPrev').addEventListener('click', () => navModal(-1));
  document.getElementById('modalNext').addEventListener('click', () => navModal(1));
  document.getElementById('modalBackdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('modalBackdrop').classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') navModal(-1);
    if (e.key === 'ArrowRight') navModal(1);
  });

  buildToggle(document.getElementById('colToggles'), [{value:3,label:'3'},{value:4,label:'4'},{value:5,label:'5'}], 'cols');
  buildToggle(document.getElementById('sortToggles'), [{value:'chrono',label:'Calendario'},{value:'pinned',label:'Feed'}], 'sort');
  buildToggle(document.getElementById('mapToggle'), [{value:'normal',label:'Normal'},{value:'map',label:'Content Map'}], 'view');

  const bioBtn = document.createElement('button');
  bioBtn.className = 'iconbtn' + (state.showBio ? ' active' : '');
  bioBtn.textContent = 'Bio';
  bioBtn.onclick = () => { state.showBio = !state.showBio; bioBtn.classList.toggle('active', state.showBio); applyBioHighlights(); savePrefs(); };
  document.getElementById('bioToggle').appendChild(bioBtn);

  loadGrid();
}

init();
</script>
</body>
</html>
